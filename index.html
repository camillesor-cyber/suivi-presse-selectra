<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selectra — Suivi Presse</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #f5f4f0;
    --bg2:     #ffffff;
    --bg3:     #eceae4;
    --border:  #e0ddd5;
    --border2: #ccc9bf;
    --text:    #1a1916;
    --muted:   #8c8a82;
    --accent:  #1d4ed8;
    --accent2: #1e40af;
    --pos:     #166534;
    --pos-bg:  #dcfce7;
    --neu:     #92400e;
    --neu-bg:  #fef3c7;
    --neg:     #991b1b;
    --neg-bg:  #fee2e2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; min-height: 100vh; }

  /* HEADER */
  header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 20px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .logo { display: flex; flex-direction: column; gap: 1px; }
  .logo-name { font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--accent); letter-spacing: 0.01em; }
  .logo-sub { font-size: 11px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
  .header-stats { display: flex; gap: 36px; }
  .stat { text-align: center; }
  .stat-val { font-family: 'DM Serif Display', serif; font-size: 26px; color: var(--text); line-height: 1; }
  .stat-label { font-size: 10px; color: var(--muted); margin-top: 2px; letter-spacing: 0.08em; text-transform: uppercase; }

  /* TOOLBAR */
  .toolbar {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 12px 40px;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .filter-group { display: flex; gap: 4px; }
  .filter-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 5px 13px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.12s;
    white-space: nowrap;
  }
  .filter-btn:hover { border-color: var(--border2); color: var(--text); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
  .sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }
  .search-wrap { flex: 1; min-width: 180px; position: relative; }
  .search-wrap input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 12px 7px 32px;
    border-radius: 6px;
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    transition: border 0.12s;
  }
  .search-wrap input:focus { border-color: var(--accent); background: var(--bg2); }
  .search-wrap input::placeholder { color: var(--muted); }
  .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; pointer-events: none; }
  .btn-add {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 7px 16px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: background 0.12s;
    white-space: nowrap;
  }
  .btn-add:hover { background: var(--accent2); }

  /* TABLE */
  .table-wrap { padding: 20px 40px; }
  .count-label { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; background: var(--bg2); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
  thead th {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.09em;
    font-weight: 500;
    padding: 10px 14px;
    text-align: left;
    background: var(--bg3);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  thead th:hover { color: var(--text); }
  thead th.sort-asc::after  { content: ' ↑'; color: var(--accent); }
  thead th.sort-desc::after { content: ' ↓'; color: var(--accent); }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--bg); }
  tbody td { padding: 13px 14px; vertical-align: middle; }

  .td-titre { max-width: 300px; }
  .td-titre a { color: var(--text); text-decoration: none; font-weight: 400; line-height: 1.45; display: block; }
  .td-titre a:hover { color: var(--accent); }
  .td-titre .no-link { color: var(--text); line-height: 1.45; }
  .td-source { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .td-date { color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }

  .badge {
    display: inline-flex; align-items: center;
    font-size: 11px; padding: 2px 8px; border-radius: 10px;
    font-weight: 500; white-space: nowrap; border: 1px solid transparent;
  }
  .badge-presse { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
  .badge-radio  { background: #f0fdf4; color: #166534; border-color: #bbf7d0; }
  .badge-tv     { background: #fdf4ff; color: #7e22ce; border-color: #e9d5ff; }
  .badge-social { background: #fff7ed; color: #c2410c; border-color: #fed7aa; }
  .badge-forum  { background: #f0fdfa; color: #0f766e; border-color: #99f6e4; }
  .badge-autre  { background: var(--bg3); color: var(--muted); border-color: var(--border); }

  .tone-label { font-size: 12px; display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 10px; font-weight: 500; }
  .tone-label.positif { background: var(--pos-bg); color: var(--pos); }
  .tone-label.neutre  { background: var(--neu-bg); color: var(--neu); }
  .tone-label.negatif { background: var(--neg-bg); color: var(--neg); }
  .tone-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .positif .tone-dot { background: var(--pos); }
  .neutre  .tone-dot { background: var(--neu); }
  .negatif .tone-dot { background: var(--neg); }

  .score-cell { display: flex; align-items: center; gap: 7px; }
  .score-bar-wrap { width: 44px; height: 3px; background: var(--bg3); border-radius: 2px; }
  .score-bar-fill { height: 100%; border-radius: 2px; background: var(--accent); opacity: 0.6; }
  .score-num { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 14px; }

  .tag-auto   { font-size: 10px; color: var(--muted); background: var(--bg3); padding: 2px 6px; border-radius: 3px; border: 1px solid var(--border); }
  .tag-manuel { font-size: 10px; color: var(--accent); background: #eff6ff; padding: 2px 6px; border-radius: 3px; border: 1px solid #bfdbfe; }

  .btn-delete { background: none; border: none; color: var(--border2); cursor: pointer; font-size: 16px; padding: 3px 6px; border-radius: 4px; transition: color 0.12s; line-height: 1; }
  .btn-delete:hover { color: var(--neg); }

  .empty { text-align: center; padding: 60px 0; color: var(--muted); background: var(--bg2); border-radius: 10px; border: 1px solid var(--border); }
  .empty-icon { font-size: 28px; margin-bottom: 10px; opacity: 0.4; }
  .empty-text { font-size: 13px; }

  /* MODAL */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 100; display: none; align-items: center; justify-content: center; }
  .overlay.open { display: flex; }
  .modal {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    width: 520px;
    max-width: calc(100vw - 32px);
    box-shadow: 0 8px 40px rgba(0,0,0,0.12);
  }
  .modal-title { font-family: 'DM Serif Display', serif; font-size: 18px; color: var(--text); margin-bottom: 20px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 5px; font-weight: 500; }
  .field input, .field select, .field textarea {
    width: 100%; background: var(--bg);
    border: 1px solid var(--border); color: var(--text);
    padding: 8px 11px; border-radius: 6px;
    font-size: 13px; font-family: 'DM Sans', sans-serif;
    outline: none; transition: border 0.12s;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); background: var(--bg2); }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
  .btn-cancel {
    background: var(--bg3); border: 1px solid var(--border);
    color: var(--muted); padding: 8px 16px; border-radius: 6px;
    font-size: 13px; cursor: pointer; font-family: 'DM Sans', sans-serif;
  }
  .btn-cancel:hover { color: var(--text); }
  .btn-save {
    background: var(--accent); color: #fff; border: none;
    padding: 8px 20px; border-radius: 6px; font-size: 13px;
    font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif;
  }
  .btn-save:hover { background: var(--accent2); }

  input[type=range] {
    -webkit-appearance: none; width: 100%; height: 4px;
    background: var(--bg3); border-radius: 2px; outline: none; border: none; padding: 0;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px;
    border-radius: 50%; background: var(--accent); cursor: pointer;
    border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.15);
  }
  .score-display { font-size: 12px; color: var(--accent); font-weight: 500; margin-top: 4px; }

  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-name">Selectra</div>
    <div class="logo-sub">Suivi presse &amp; mentions</div>
  </div>
  <div class="header-stats">
    <div class="stat"><div class="stat-val" id="stat-total">0</div><div class="stat-label">Total</div></div>
    <div class="stat"><div class="stat-val" id="stat-today">0</div><div class="stat-label">Aujourd'hui</div></div>
    <div class="stat"><div class="stat-val" id="stat-pos">0</div><div class="stat-label">Positives</div></div>
  </div>
</header>

<div class="toolbar">
  <div class="filter-group" id="filter-tone">
    <button class="filter-btn active" data-val="">Toutes</button>
    <button class="filter-btn" data-val="positif">Positif</button>
    <button class="filter-btn" data-val="neutre">Neutre</button>
    <button class="filter-btn" data-val="negatif">Négatif</button>
  </div>
  <div class="sep"></div>
  <div class="filter-group" id="filter-type">
    <button class="filter-btn active" data-val="">Tous types</button>
    <button class="filter-btn" data-val="presse">Presse</button>
    <button class="filter-btn" data-val="radio">Radio</button>
    <button class="filter-btn" data-val="tv">TV</button>
    <button class="filter-btn" data-val="social">Social</button>
    <button class="filter-btn" data-val="forum">Forum</button>
  </div>
  <div class="sep"></div>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" id="search" placeholder="Rechercher titre, source...">
  </div>
  <button class="btn-add" onclick="openModal()">+ Ajouter</button>
</div>

<div class="table-wrap">
  <div class="count-label" id="count-label"></div>
  <table id="main-table">
    <thead>
      <tr>
        <th onclick="sortBy('titre')">Titre</th>
        <th onclick="sortBy('source')">Source</th>
        <th onclick="sortBy('date')">Date</th>
        <th onclick="sortBy('type')">Type</th>
        <th onclick="sortBy('tonalite')">Tonalité</th>
        <th onclick="sortBy('score')">Score</th>
        <th>Ajout</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">
    <div class="empty-icon">◎</div>
    <div class="empty-text">Aucune mention trouvée</div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-title">Ajouter une mention</div>
    <div class="field">
      <label>Titre *</label>
      <input type="text" id="f-titre" placeholder="Titre de l'article ou de l'émission">
    </div>
    <div class="field-row">
      <div class="field">
        <label>Source *</label>
        <input type="text" id="f-source" placeholder="Le Monde, France Inter...">
      </div>
      <div class="field">
        <label>Date *</label>
        <input type="date" id="f-date">
      </div>
    </div>
    <div class="field">
      <label>URL (optionnel)</label>
      <input type="url" id="f-url" placeholder="https://...">
    </div>
    <div class="field-row">
      <div class="field">
        <label>Type de média</label>
        <select id="f-type">
          <option value="presse">Presse</option>
          <option value="radio">Radio</option>
          <option value="tv">TV</option>
          <option value="social">Réseaux sociaux</option>
          <option value="forum">Forum / Blog</option>
          <option value="autre">Autre</option>
        </select>
      </div>
      <div class="field">
        <label>Tonalité</label>
        <select id="f-tonalite">
          <option value="positif">Positif</option>
          <option value="neutre">Neutre</option>
          <option value="negatif">Négatif</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Score de visibilité — <span id="score-val">5</span>/10</label>
      <input type="range" id="f-score" min="1" max="10" value="5"
             oninput="document.getElementById('score-val').textContent=this.value">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Annuler</button>
      <button class="btn-save" onclick="saveMention()">Enregistrer</button>
    </div>
  </div>
</div>

<script>
const DATA_URL    = 'mentions.json';
const STORAGE_KEY = 'selectra_mentions_manual';
let mentions = [];
let sortKey  = 'date';
let sortDir  = 'desc';
let filterTone = '';
let filterType = '';
let searchQ    = '';

async function loadData() {
  try {
    const res    = await fetch(DATA_URL + '?t=' + Date.now());
    const remote = await res.json();
    const local  = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    const remoteIds = new Set(remote.map(m => m.id));
    mentions = [...remote, ...local.filter(m => !remoteIds.has(m.id))];
  } catch(e) {
    mentions = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  }
  render();
}

function parseDate(str) {
  if (!str) return 0;
  const p = str.split('/');
  if (p.length === 3) return new Date(`${p[2]}-${p[1]}-${p[0]}`).getTime() || 0;
  return 0;
}

function getFiltered() {
  return mentions.filter(m => {
    if (filterTone && m.tonalite !== filterTone) return false;
    if (filterType && m.type     !== filterType) return false;
    if (searchQ) {
      const q = searchQ.toLowerCase();
      if (!String(m.titre||'').toLowerCase().includes(q) &&
          !String(m.source||'').toLowerCase().includes(q)) return false;
    }
    return true;
  }).sort((a, b) => {
    let va = a[sortKey] ?? '', vb = b[sortKey] ?? '';
    if (sortKey === 'date')  { va = parseDate(va); vb = parseDate(vb); }
    if (sortKey === 'score') { va = +va; vb = +vb; }
    if (va < vb) return sortDir === 'asc' ? -1 : 1;
    if (va > vb) return sortDir === 'asc' ?  1 : -1;
    return 0;
  });
}

function render() {
  const today    = new Date().toLocaleDateString('fr-FR', {day:'2-digit',month:'2-digit',year:'numeric'}).replace(/\//g,'/');
  const filtered = getFiltered();

  document.getElementById('stat-total').textContent = mentions.length;
  document.getElementById('stat-today').textContent = mentions.filter(m => m.date === today).length;
  document.getElementById('stat-pos').textContent   = mentions.filter(m => m.tonalite === 'positif').length;
  document.getElementById('count-label').textContent =
    `${filtered.length} mention${filtered.length !== 1 ? 's' : ''} affichée${filtered.length !== 1 ? 's' : ''}`;

  const tbody = document.getElementById('tbody');
  const empty = document.getElementById('empty');
  const table = document.getElementById('main-table');

  if (filtered.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    table.style.display = 'none';
    return;
  }
  empty.style.display = 'none';
  table.style.display = '';

  tbody.innerHTML = filtered.map(m => `
    <tr>
      <td class="td-titre">
        ${m.url
          ? `<a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.titre)}</a>`
          : `<span class="no-link">${esc(m.titre)}</span>`}
      </td>
      <td class="td-source">${esc(m.source)}</td>
      <td class="td-date">${esc(m.date)}</td>
      <td><span class="badge badge-${esc(m.type)}">${esc(m.type)}</span></td>
      <td>
        <span class="tone-label ${esc(m.tonalite)}">
          <span class="tone-dot"></span>${esc(m.tonalite)}
        </span>
      </td>
      <td>
        <div class="score-cell">
          <div class="score-bar-wrap">
            <div class="score-bar-fill" style="width:${(m.score/10)*100}%"></div>
          </div>
          <span class="score-num">${m.score}</span>
        </div>
      </td>
      <td><span class="tag-${esc(m.ajout)}">${esc(m.ajout)}</span></td>
      <td>
        <button class="btn-delete" onclick="deleteMention('${esc(m.id)}')" title="Supprimer">×</button>
      </td>
    </tr>
  `).join('');
}

function esc(s) {
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function sortBy(key) {
  if (sortKey === key) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  else { sortKey = key; sortDir = 'desc'; }
  document.querySelectorAll('thead th').forEach(th => th.classList.remove('sort-asc','sort-desc'));
  const keys = ['titre','source','date','type','tonalite','score'];
  const idx  = keys.indexOf(key);
  if (idx >= 0) document.querySelectorAll('thead th')[idx].classList.add(sortDir==='asc'?'sort-asc':'sort-desc');
  render();
}

document.getElementById('filter-tone').addEventListener('click', e => {
  if (!e.target.matches('.filter-btn')) return;
  document.querySelectorAll('#filter-tone .filter-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  filterTone = e.target.dataset.val;
  render();
});

document.getElementById('filter-type').addEventListener('click', e => {
  if (!e.target.matches('.filter-btn')) return;
  document.querySelectorAll('#filter-type .filter-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  filterType = e.target.dataset.val;
  render();
});

document.getElementById('search').addEventListener('input', e => {
  searchQ = e.target.value.trim();
  render();
});

function openModal() {
  const now = new Date();
  document.getElementById('f-date').value =
    `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  document.getElementById('f-score').value = 5;
  document.getElementById('score-val').textContent = '5';
  ['f-titre','f-source','f-url'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('overlay').classList.add('open');
  setTimeout(() => document.getElementById('f-titre').focus(), 50);
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
}

document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) closeModal();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

function saveMention() {
  const titre   = document.getElementById('f-titre').value.trim();
  const source  = document.getElementById('f-source').value.trim();
  const dateRaw = document.getElementById('f-date').value;
  if (!titre || !source || !dateRaw) {
    alert('Titre, source et date sont obligatoires.');
    return;
  }
  const [y,m,d] = dateRaw.split('-');
  const mention = {
    id:       'manual-' + Date.now(),
    titre,
    source,
    date:     `${d}/${m}/${y}`,
    url:      document.getElementById('f-url').value.trim(),
    type:     document.getElementById('f-type').value,
    tonalite: document.getElementById('f-tonalite').value,
    score:    parseInt(document.getElementById('f-score').value),
    ajout:    'manuel'
  };
  const local = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  local.unshift(mention);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(local));
  mentions.unshift(mention);
  closeModal();
  render();
}

function deleteMention(id) {
  if (!confirm('Supprimer cette mention ?')) return;
  mentions = mentions.filter(m => m.id !== id);
  const local = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]').filter(m => m.id !== id);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(local));
  render();
}

loadData();
</script>
</body>
</html>
